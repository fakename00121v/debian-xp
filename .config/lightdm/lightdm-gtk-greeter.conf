[greeter]
background=/usr/share/backgrounds/lightdm-wallpaper.jpg
theme-name=Windows XP Embedded
icon-theme-name=Windows-XP
cursor-theme-name=Adwaita
font-name=Sans 11
xft-antialias=true
xft-dpi=96
xft-hintstyle=hintslight
xft-rgba=rgb

show-clock=true
clock-format=%A, %d %B %Y  %H:%M:%S

indicators=~host;~spacer;~clock;~spacer;~session;~power
